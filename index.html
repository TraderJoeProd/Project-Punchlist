<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Punchlist">
<title>Punchlist</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar"><span class="logo">✔︎</span><h1>Punchlist</h1><span class="grow"></span>
  <button id="bell" class="bell" aria-label="Notifications" hidden>🔔<span id="badge" class="badge" hidden></span></button></header>
<div id="offline" class="offline" hidden>Offline: showing the last synced copy. Changes need a connection.</div>
<main id="main"><div class="empty"><div class="spinner" style="margin:auto"></div><p>Loading…</p></div></main>
<button id="scanFab" class="fab" aria-label="Scan handwritten list" hidden>📷 <span>Scan</span></button>
<input type="file" id="scanInput" accept="image/*" capture="environment" hidden>
<nav class="tabbar" id="tabbar" hidden></nav>
<dialog id="dialog"></dialog>
<div id="toast" class="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/parse.js"></script>
<script src="js/transcribe.js"></script>
<script src="js/app.js"></script>
</body>
</html>
