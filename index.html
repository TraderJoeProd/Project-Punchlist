<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Punchlist">
<title>Punchlist</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<header class="topbar"><span class="logo">✔︎</span><h1>Punchlist</h1></header>
<main id="main"></main>
<button id="scanFab" class="fab" aria-label="Scan handwritten list">📷 <span>Scan</span></button>
<input type="file" id="scanInput" accept="image/*" capture="environment" hidden>
<nav class="tabbar">
  <button data-view="list" class="active"><span>📋</span>List</button>
  <button data-view="jobs"><span>🏗️</span>Jobs</button>
  <button data-view="profiles"><span>🏢</span>Profiles</button>
  <button data-view="settings"><span>⚙️</span>Settings</button>
</nav>
<dialog id="dialog"></dialog>
<div id="toast" class="toast" role="status"></div>
<script src="./js/parse.js"></script>
<script src="./js/transcribe.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
